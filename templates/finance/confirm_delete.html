{% extends 'finance/base.html' %}

{% block title %}Confirm Delete - Finance Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Confirm Delete</h1>
</div>

<div class="form-card text-center" style="margin: 0 auto; max-width: 480px;">
    <div class="delete-icon" style="display: flex; align-items: center; justify-content: center; margin: 1rem auto 1.25rem; width: 64px; height: 64px; border-radius: 50%; background: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid rgba(244, 63, 94, 0.3);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <h3>Are you sure?</h3>
    <p class="text-muted" style="margin-top: 0.5rem;">You are about to delete <strong>{{ object }}</strong>.</p>
    <p class="text-muted">This action cannot be undone.</p>
    <div class="form-actions" style="justify-content: center; margin-top: 2rem;">
        <a href="{% url cancel_url %}" class="btn btn-outline">Cancel</a>
        <form method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
